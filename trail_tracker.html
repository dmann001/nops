<!DOCTYPE html>
<!--
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAMPS - Advanced Trail Tracker</title>
    <style>
        :root {
            --background: hsl(0 0% 3.9%);
            --foreground: hsl(0 0% 98%);
            --card: hsl(0 0% 3.9%);
            --card-foreground: hsl(0 0% 98%);
            --popover: hsl(0 0% 3.9%);
            --popover-foreground: hsl(0 0% 98%);
            --primary: hsl(0 0% 98%);
            --primary-foreground: hsl(0 0% 9.0%);
            --secondary: hsl(0 0% 14.9%);
            --secondary-foreground: hsl(0 0% 98%);
            --muted: hsl(0 0% 14.9%);
            --muted-foreground: hsl(0 0% 63.9%);
            --accent: hsl(0 0% 14.9%);
            --accent-foreground: hsl(0 0% 98%);
            --destructive: hsl(0 62.8% 30.6%);
            --destructive-foreground: hsl(0 0% 98%);
            --border: hsl(0 0% 14.9%);
            --input: hsl(0 0% 14.9%);
            --ring: hsl(0 0% 83.1%);
            --radius: 0.5rem;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--foreground);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 280px;
            background-color: var(--background);
            border-right: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .main-content {
            flex: 1;
            position: relative;
        }
        #trailCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .panel {
            background-color: var(--secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px;
        }
        .panel h2 {
            font-size: 16px;
            font-weight: 600;
            color: var(--foreground);
            margin: 0 0 16px 0;
        }
        button {
            width: 100%;
            background-color: var(--primary);
            color: var(--primary-foreground);
            border: none;
            padding: 10px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: hsl(0 0% 80%);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .stat-item { text-align: center; }
        .stat-value {
            font-size: 22px;
            font-weight: 700;
            color: var(--foreground);
        }
        .stat-label {
            font-size: 12px;
            color: var(--muted-foreground);
        }
        .status {
            text-align: center;
            font-size: 12px;
            color: var(--muted-foreground);
            margin-top: auto;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="panel">
            <h2>Controls</h2>
            <button id="resetButton">Reset Trail</button>
            <div style="margin-top: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button id="zoomInButton">Zoom In</button>
                <button id="zoomOutButton">Zoom Out</button>
            </div>
            <button id="resetViewButton" style="margin-top: 8px;">Reset View</button>
            <div style="margin-top: 12px;">
                <label for="expectedHz" style="display: block; margin-bottom: 8px; font-size: 12px; color: var(--muted-foreground);">Expected Data Rate (Hz):</label>
                <select id="expectedHz" style="width: 100%; padding: 8px; background: var(--input); color: var(--foreground); border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px;">
                    <option value="50">50 Hz</option>
                    <option value="60">60 Hz</option>
                    <option value="75">75 Hz</option>
                    <option value="100" selected>100 Hz (Recommended)</option>
                </select>
            </div>
        </div>
        <div class="panel">
            <h2>Dashboard</h2>
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value" id="stat-pos-x">--</div>
                    <div class="stat-label">Position X (m)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-pos-y">--</div>
                    <div class="stat-label">Position Y (m)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-velocity">--</div>
                    <div class="stat-label">Velocity (m/s)</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="stat-heading">--</div>
                    <div class="stat-label">Heading (°)</div>
                </div>
            </div>
        </div>
        <div class="panel" style="margin-top: auto;">
             <div class="status" id="status">Connecting...</div>
        </div>
    </div>
    <div class="main-content">
        <canvas id="trailCanvas"></canvas>
    </div>

    <script>
        // ============================================================================
        // BRAMPS Trail Tracker - Real-time 2D Position Visualization
        // ============================================================================
        
        const SERVER_URL = `http://${window.location.hostname}:5000`;
        const canvas = document.getElementById('trailCanvas');
        const ctx = canvas.getContext('2d');
        const statusEl = document.getElementById('status');
        const resetButton = document.getElementById('resetButton');
        const zoomInButton = document.getElementById('zoomInButton');
        const zoomOutButton = document.getElementById('zoomOutButton');
        const resetViewButton = document.getElementById('resetViewButton');
        
        // Dashboard UI elements
        const statPosX = document.getElementById('stat-pos-x');
        const statPosY = document.getElementById('stat-pos-y');
        const statVelocity = document.getElementById('stat-velocity');
        const statHeading = document.getElementById('stat-heading');
        const expectedHzSelect = document.getElementById('expectedHz');

        // Trail data and visualization state
        let trailData = { path: [] };
        let view = {
            scale: 50,           // Pixels per meter (zoom level)
            centerX: 0,          // Canvas center X coordinate
            centerY: 0,          // Canvas center Y coordinate
            offsetX: 0,          // Pan offset X (pixels)
            offsetY: 0,          // Pan offset Y (pixels)
            isDragging: false,   // Drag state flag
            dragStartX: 0,       // Drag start X
            dragStartY: 0        // Drag start Y
        };

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            
            // Center is always the middle of the canvas
            view.centerX = canvas.width / 2;
            view.centerY = canvas.height / 2;
        }

        async function fetchData() {
            try {
                const response = await fetch(`${SERVER_URL}/trail_data`);
                if (!response.ok) throw new Error(`Server Error: ${response.status}`);
                
                trailData = await response.json();
                
                statusEl.textContent = `Connected | Points: ${trailData.path.length}`;
                updateDashboard(trailData);

            } catch (error) {
                statusEl.textContent = `Connection Error`;
                console.error("Fetch error:", error);
            }
        }
        
        // Latest IMU sensor state for real-time visualization
        let latestIMUData = {
            heading_deg: 0,                          // Device heading in degrees (0° = North)
            velocity: { vx: 0, vy: 0, speed: 0 },   // Velocity vector and magnitude
            is_stationary: false                     // Motion detection state
        };

        function updateDashboard(data) {
            // Handle the nested structure from server response
            const state = data.current_state || data;
            const position = state.position || {};
            const velocity = state.velocity || {};
            
            // Store for IMU visualization
            latestIMUData.heading_deg = state.heading_deg || state.heading || 0;
            latestIMUData.velocity = velocity;
            latestIMUData.is_stationary = state.is_stationary || false;
            
            // Update position
            if (position.x !== undefined) {
                statPosX.textContent = position.x.toFixed(2);
            } else {
                statPosX.textContent = '--';
            }
            
            if (position.y !== undefined) {
                statPosY.textContent = position.y.toFixed(2);
            } else {
                statPosY.textContent = '--';
            }
            
            // Update velocity (use speed if available, otherwise use magnitude)
            if (velocity.speed !== undefined) {
                statVelocity.textContent = velocity.speed.toFixed(2);
            } else if (velocity !== undefined && typeof velocity === 'number') {
                statVelocity.textContent = velocity.toFixed(2);
            } else {
                statVelocity.textContent = '--';
            }
            
            // Update heading (use heading_deg if available, otherwise heading)
            if (state.heading_deg !== undefined) {
                statHeading.textContent = state.heading_deg.toFixed(0);
            } else if (state.heading !== undefined) {
                statHeading.textContent = state.heading.toFixed(0);
            } else {
                statHeading.textContent = '--';
            }
        }

        // Gyroscope visualization animation state
        let gyroAnimState = {
            rotationPhase: 0,    // Rotation animation phase for gimbal rings
            pulsePhase: 0        // Pulse animation phase for glow effect
        };

        /**
         * Draw 3D gyroscopic ball visualization with rotating gimbal rings
         * Represents device orientation and motion state in real-time
         * 
         * @param {number} x - Canvas X coordinate
         * @param {number} y - Canvas Y coordinate
         * @param {number} heading_deg - Device heading in degrees
         * @param {object} velocity - Velocity vector {vx, vy, speed}
         * @param {boolean} is_stationary - Motion detection state
         */
        function drawGyroscopicBall(x, y, heading_deg, velocity, is_stationary) {
            ctx.save();
            ctx.translate(x, y);
            
            // Update continuous animation phases
            gyroAnimState.rotationPhase += is_stationary ? 0.005 : 0.03;
            gyroAnimState.pulsePhase += 0.05;
            
            const radius = 250;  // Gyroscope sphere radius (pixels)
            const headingRad = (heading_deg) * Math.PI / 180;
            const speed = velocity?.speed || 0;
            
            // Outer pulsing glow effect (active motion indicator)
            if (!is_stationary && speed > 0.01) {
                const glowRadius = radius + 15 + Math.sin(gyroAnimState.pulsePhase) * 5;
                const gradient = ctx.createRadialGradient(0, 0, radius, 0, 0, glowRadius);
                gradient.addColorStop(0, 'hsla(346.8, 77%, 49%, 0)');
                gradient.addColorStop(0.7, 'hsla(346.8, 77%, 49%, 0.2)');
                gradient.addColorStop(1, 'hsla(346.8, 77%, 49%, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, glowRadius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // 3D sphere with radial gradient for depth perception
            const sphereGradient = ctx.createRadialGradient(-15, -15, 5, 0, 0, radius);
            if (is_stationary) {
                // Grayscale gradient for stationary state
                sphereGradient.addColorStop(0, 'hsl(0, 0%, 60%)');
                sphereGradient.addColorStop(0.7, 'hsl(0, 0%, 35%)');
                sphereGradient.addColorStop(1, 'hsl(0, 0%, 20%)');
            } else {
                // Red gradient for active motion state
                sphereGradient.addColorStop(0, 'hsl(346.8, 77%, 65%)');
                sphereGradient.addColorStop(0.7, 'hsl(346.8, 77%, 49%)');
                sphereGradient.addColorStop(1, 'hsl(346.8, 77%, 30%)');
            }
            ctx.fillStyle = sphereGradient;
            ctx.beginPath();
            ctx.arc(0, 0, radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Three-axis gimbal ring system (simulates physical gyroscope)
            ctx.lineWidth = 3;
            
            // Yaw ring (horizontal plane) - tracks heading orientation
            ctx.save();
            ctx.rotate(headingRad);
            ctx.strokeStyle = 'hsla(200, 70%, 60%, 0.8)';  // Blue ring
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 1.2, radius * 0.4, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            
            // Pitch ring (vertical plane) - continuous animation
            ctx.save();
            ctx.rotate(gyroAnimState.rotationPhase);
            ctx.strokeStyle = 'hsla(280, 70%, 60%, 0.6)';  // Purple ring
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 0.4, radius * 1.2, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            
            // Roll ring (diagonal plane) - counter-rotating animation
            ctx.save();
            ctx.rotate(-gyroAnimState.rotationPhase * 1.5);
            ctx.strokeStyle = 'hsla(120, 70%, 60%, 0.6)';  // Green ring
            ctx.beginPath();
            ctx.ellipse(0, 0, radius * 1.1, radius * 0.5, Math.PI / 4, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
            
            // Draw directional axis lines (showing orientation)
            ctx.save();
            ctx.rotate(headingRad);
            
            // Forward axis (North indicator)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(0, -radius - 10);
            ctx.stroke();
            
            // Arrow head
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.moveTo(0, -radius - 10);
            ctx.lineTo(-6, -radius - 2);
            ctx.lineTo(6, -radius - 2);
            ctx.closePath();
            ctx.fill();
            
            // Side axes (dimmer)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-radius - 5, 0);
            ctx.lineTo(radius + 5, 0);
            ctx.stroke();
            
            ctx.restore();
            
            // Draw velocity vector
            if (velocity && speed > 0.01) {
                const vx = velocity.vx || 0;
                const vy = velocity.vy || 0;
                const arrowLength = Math.min(speed * 30, 60);
                const velAngle = Math.atan2(vx, -vy);
                
                ctx.save();
                ctx.rotate(velAngle);
                
                // Velocity arrow
                ctx.strokeStyle = 'hsl(142.1, 76%, 42%)';
                ctx.lineWidth = 4;
                ctx.shadowColor = 'hsl(142.1, 76%, 42%)';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(0, radius + 5);
                ctx.lineTo(0, radius + 5 + arrowLength);
                ctx.stroke();
                ctx.shadowBlur = 0;
                
                // Arrow head
                ctx.fillStyle = 'hsl(142.1, 76%, 42%)';
                ctx.beginPath();
                ctx.moveTo(0, radius + 5 + arrowLength);
                ctx.lineTo(-8, radius + 5 + arrowLength - 12);
                ctx.lineTo(8, radius + 5 + arrowLength - 12);
                ctx.closePath();
                ctx.fill();
                
                ctx.restore();
            }
            
            // Draw rotation trails when moving
            if (!is_stationary && speed > 0.01) {
                const trailCount = 8;
                for (let i = 0; i < trailCount; i++) {
                    const angle = (gyroAnimState.rotationPhase + (i * Math.PI * 2 / trailCount)) % (Math.PI * 2);
                    const trailRadius = radius * 1.3;
                    const alpha = 0.3 * (1 - i / trailCount);
                    
                    ctx.fillStyle = `hsla(346.8, 77%, 49%, ${alpha})`;
                    ctx.beginPath();
                    ctx.arc(
                        Math.cos(angle) * trailRadius,
                        Math.sin(angle) * trailRadius,
                        3,
                        0,
                        Math.PI * 2
                    );
                    ctx.fill();
                }
            }
            
            // Draw center dot
            ctx.fillStyle = is_stationary ? 'rgba(255, 255, 255, 0.5)' : 'white';
            ctx.beginPath();
            ctx.arc(0, 0, 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = 'var(--background)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            const path = trailData.path;
            if (path && path.length > 0) {
                ctx.save();
                
                // Convert trail coordinates (in meters) to canvas coordinates
                // The tracker dot stays in the center, so we offset the trail relative to current position
                const currentPoint = path[path.length - 1];
                const currentX = Array.isArray(currentPoint) ? currentPoint[0] : (currentPoint.x || 0);
                const currentY = Array.isArray(currentPoint) ? currentPoint[1] : (currentPoint.y || 0);
                
                // Convert meters to pixels, with current position at center (plus pan offset)
                const getX = (point) => {
                    const x = Array.isArray(point) ? point[0] : (point.x || 0);
                    return view.centerX + (x - currentX) * view.scale + view.offsetX;
                };
                const getY = (point) => {
                    const y = Array.isArray(point) ? point[1] : (point.y || 0);
                    // Flip Y axis (canvas Y increases downward, but we want Y to increase upward)
                    return view.centerY - (y - currentY) * view.scale + view.offsetY;
                };
                
                // Draw trail path
                if (path.length > 1) {
                    ctx.strokeStyle = 'hsl(346.8 77.2% 49.8%)'; // Red trail
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                    
                    ctx.beginPath();
                    ctx.moveTo(getX(path[0]), getY(path[0]));
                    for (let i = 1; i < path.length; i++) {
                        ctx.lineTo(getX(path[i]), getY(path[i]));
                    }
                    ctx.stroke();
                }
                
                // Draw start point (green) if not at current position
                if (path.length > 1) {
                    const startX = getX(path[0]);
                    const startY = getY(path[0]);
                    const distFromCenter = Math.sqrt(
                        Math.pow(startX - view.centerX, 2) + 
                        Math.pow(startY - view.centerY, 2)
                    );
                    if (distFromCenter > 10) { // Only draw if start is not too close to center
                        ctx.beginPath();
                        ctx.arc(startX, startY, 6, 0, Math.PI * 2);
                        ctx.fillStyle = 'hsl(142.1 76.2% 42.2%)';
                        ctx.fill();
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                }
                
                // Draw gyroscopic ball at current position
                drawGyroscopicBall(
                    view.centerX + view.offsetX,
                    view.centerY + view.offsetY,
                    latestIMUData.heading_deg,
                    latestIMUData.velocity,
                    latestIMUData.is_stationary
                );
                
                ctx.restore();
            } else {
                // Draw gyroscopic ball in center even when no path
                ctx.save();
                drawGyroscopicBall(
                    view.centerX + view.offsetX,
                    view.centerY + view.offsetY,
                    latestIMUData.heading_deg,
                    latestIMUData.velocity,
                    latestIMUData.is_stationary
                );
                ctx.restore();
            }

            requestAnimationFrame(draw);
        }

        async function resetTrail() {
            await fetch(`${SERVER_URL}/reset_trail`, { method: 'POST' });
            fetchData();
        }

        async function changeExpectedHz() {
            const hz = parseInt(expectedHzSelect.value);
            try {
                const response = await fetch(`${SERVER_URL}/set_expected_hz`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ hz: hz })
                });
                const result = await response.json();
                if (response.ok) {
                    statusEl.textContent = `Data rate: ${hz} Hz | Reset trail to apply`;
                    console.log(`Expected Hz changed to: ${hz}`);
                } else {
                    console.error('Failed to change expected Hz:', result.error);
                    statusEl.textContent = `Error: ${result.error}`;
                }
            } catch (error) {
                console.error('Error changing expected Hz:', error);
                statusEl.textContent = `Connection Error`;
            }
        }

        // Load current expected Hz on page load
        async function loadExpectedHz() {
            try {
                const response = await fetch(`${SERVER_URL}/get_expected_hz`);
                const data = await response.json();
                if (data.expected_hz) {
                    expectedHzSelect.value = data.expected_hz.toString();
                }
            } catch (error) {
                console.error('Error loading expected Hz:', error);
            }
        }

        // Zoom button functions
        function zoomIn() {
            view.scale *= 1.2;
            view.scale = Math.max(10, Math.min(200, view.scale));
        }
        
        function zoomOut() {
            view.scale *= 0.833; // 1/1.2
            view.scale = Math.max(10, Math.min(200, view.scale));
        }
        
        function resetView() {
            view.scale = 50;
            view.offsetX = 0;
            view.offsetY = 0;
        }

        // Event Listeners
        resetButton.addEventListener('click', resetTrail);
        zoomInButton.addEventListener('click', zoomIn);
        zoomOutButton.addEventListener('click', zoomOut);
        resetViewButton.addEventListener('click', resetView);
        expectedHzSelect.addEventListener('change', changeExpectedHz);
        
        // Pan (drag) functionality
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                view.isDragging = true;
                view.dragStartX = e.clientX - view.offsetX;
                view.dragStartY = e.clientY - view.offsetY;
                canvas.style.cursor = 'grabbing';
                e.preventDefault();
            }
        });
        
        canvas.addEventListener('mousemove', (e) => {
            if (view.isDragging) {
                view.offsetX = e.clientX - view.dragStartX;
                view.offsetY = e.clientY - view.dragStartY;
            } else {
                canvas.style.cursor = 'grab';
            }
        });
        
        window.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                view.isDragging = false;
                canvas.style.cursor = 'grab';
            }
        });
        
        canvas.addEventListener('mouseleave', () => {
            view.isDragging = false;
            canvas.style.cursor = 'grab';
        });
        
        // Zoom with mouse wheel
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            view.scale *= zoomFactor;
            view.scale = Math.max(10, Math.min(200, view.scale));
        });
        
        // Set initial cursor style
        canvas.style.cursor = 'grab';
        
        window.addEventListener('resize', resizeCanvas);

        // Initial setup
        resizeCanvas();
        loadExpectedHz(); // Load current expected Hz
        setInterval(fetchData, 100); // Fetch data 10 times per second
        requestAnimationFrame(draw);
    </script>
</body>
</html>
